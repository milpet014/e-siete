name: esiete-nextcloud

services:
  nextcloud:
    image: nextcloud:35-apache
    container_name: esiete-nextcloud
    restart: unless-stopped

    ports:
      - "${BIND_IP}:8081:80"

    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}

      REDIS_HOST: redis

      NEXTCLOUD_TRUSTED_DOMAINS: ${CLOUD_DOMAIN}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      APACHE_DISABLE_REWRITE_IP: "1"

      OVERWRITEHOST: ${CLOUD_DOMAIN}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://${CLOUD_DOMAIN}

      # PHP a uploady
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 2G
      APACHE_BODY_LIMIT: 2147483648

    volumes:
      - ./data:/var/www/html
      - ./storage:/var/www/html/data

    networks:
      - backend

    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: esiete-redis
    restart: unless-stopped

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    networks:
      - backend

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  backend:
    external: true
    name: esiete-backend