
name: esiete-zensical

services:
  zensical:
    image: nginx:stable-alpine
    container_name: esiete-zensical
    restart: unless-stopped

    ports:
      - "${BIND_IP}:8082:80"

    volumes:
      - ./site:/usr/share/nginx/html:ro

  build:
    image: zensical/zensical:latest
    profiles:
      - tools

    user: "${PUID:-1000}:${PGID:-1000}"

    volumes:
      - ./:/docs

    command: ["build"]
