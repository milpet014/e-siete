name: esiete-mariadb

services:
  mariadb:
    image: lscr.io/linuxserver/mariadb:11.8.9
    container_name: esiete-mariadb
    restart: unless-stopped

    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: Europe/Bratislava

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}

      CLI_OPTS: "--innodb-log-file-size=256M"

    volumes:
      - ./data:/config

    networks:
      - backend

networks:
  backend:
    external: true
    name: esiete-backend